<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>[Esc] Hacker Escape Rooms</title>
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png">
    <link rel='stylesheet' href='css/style.css'>
</head>
<body>
    <header class="header">
        <a class="header__brand" href="index.html">
            <img class="header__logo" src="images/logo.png" alt="[Esc] logo">
            <h1 class="header__title">Hacker Escape Rooms</h1>
        </a>
    </header>

    <main>
        <section class="hero">
            <img class="hero__image" src="images/hacker.png" alt="A hooded person in front of PC screens">
            <div class="hero__actions">
                <a class="button button--onsite" href="#">On-site challenges</a>
                <a class="button button--online" href="#">Online challenges</a>
            </div>
        </section>
        <section class="quotes">
            <figure class="quote">
                <img class="quote__avatar" src="images/john_doe.png" alt="John Doe">
                <div class="quote__content">
                    <blockquote class="quote__text">This is a quote about how amazing this place is and how much fun me and my friends had when we tried it
                    </blockquote>
                    <figcaption class="quote__author">John Doe, visited us in September 2021</figcaption>
                </div>
            </figure>
